# Builds on every push to main and publishes the built site to the gh-pages branch.
# One-time: repo Settings > Pages > Source: "Deploy from a branch" > gh-pages, folder "/ (root)".
name: Build and publish to gh-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:contrast
      - name: Build
        run: |
          REPO="${{ github.event.repository.name }}"
          # A user site (<user>.github.io) is served from the root; a project site from /<repo>/.
          if [[ "$REPO" == *.github.io ]]; then BASE="/"; else BASE="/$REPO/"; fi
          npx ng build --configuration production --base-href "$BASE"
      - name: SPA fallback (Pages serves 404.html for deep links such as /login)
        run: cp dist/sdash-v2/browser/index.html dist/sdash-v2/browser/404.html
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist/sdash-v2/browser
          publish_branch: gh-pages
          force_orphan: true
